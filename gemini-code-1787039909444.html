<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Hiro - 3 Cats</title>
  <!-- นำเข้า A-Frame และ AR.js เวอร์ชันที่เสถียร -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    
    /* UI สำหรับปุ่มกด */
    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9999; /* ให้อยู่หน้าสุดเสมอ */
      pointer-events: none; 
    }
    #status-text {
      background: rgba(0, 0, 0, 0.8);
      color: #FFD54F;
      padding: 10px 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      display: none;
      font-size: 18px;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      pointer-events: auto; /* ให้ปุ่มกดได้ */
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button:active { transform: scale(0.95); }
    #btn-walk { background: #4CAF50; color: white; }
    #btn-stop { background: #f44336; color: white; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- ส่วน UI (ปุ่มและข้อความ) -->
  <div id="ui-container">
    <div id="status-text">พบ HIRO Marker 🐱</div>
    <div class="btn-group">
      <button id="btn-walk">เดิน 🚶</button>
      <button id="btn-stop">หยุดเดิน 🛑</button>
    </div>
  </div>

  <!-- ส่วน AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" vr-mode-ui="enabled: false">
    
    <a-marker preset="hiro" id="hiro-marker">
      
      <!-- แมวตัวที่ 1 (สีส้ม) -->
      <a-entity class="orbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear; pauseEvents: pauseWalk; resumeEvents: resumeWalk;">
        <a-entity position="1.2 0 0">
          <a-box color="#E67E22" depth="0.5" height="0.25" width="0.25" position="0 0.15 0"></a-box>
          <a-box color="#D35400" depth="0.2" height="0.2" width="0.2" position="0 0.3 -0.25"></a-box>
          <a-cone color="#E67E22" radius-bottom="0.05" height="0.1" position="-0.07 0.4 -0.25"></a-cone>
          <a-cone color="#E67E22" radius-bottom="0.05" height="0.1" position="0.07 0.4 -0.25"></a-cone>
          <a-entity position="0 0.25 0.25" animation="property: rotation; to: 0 45 0; dir: alternate; loop: true; dur: 300;">
            <a-cylinder color="#D35400" radius="0.03" height="0.4" rotation="45 0 0" position="0 0.1 0.1"></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- แมวตัวที่ 2 (สีดำ) -->
      <a-entity class="orbit" animation="property: rotation; to: 0 -360 0; loop: true; dur: 3500; easing: linear; pauseEvents: pauseWalk; resumeEvents: resumeWalk;">
        <a-entity position="-0.6 0.4 0" scale="0.7 0.7 0.7">
          <a-box color="#333333" depth="0.5" height="0.25" width="0.25" position="0 0.15 0"></a-box>
          <a-box color="#1A1A1A" depth="0.2" height="0.2" width="0.2" position="0 0.3 -0.25"></a-box>
          <a-cone color="#333333" radius-bottom="0.05" height="0.1" position="-0.07 0.4 -0.25"></a-cone>
          <a-cone color="#333333" radius-bottom="0.05" height="0.1" position="0.07 0.4 -0.25"></a-cone>
          <a-entity position="0 0.25 0.25" animation="property: rotation; to: 0 -50 0; dir: alternate; loop: true; dur: 200;">
            <a-cylinder color="#1A1A1A" radius="0.03" height="0.4" rotation="60 0 0" position="0 0.1 0.1"></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- แมวตัวที่ 3 (สีขาว) -->
      <a-entity class="orbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear; pauseEvents: pauseWalk; resumeEvents: resumeWalk;">
        <a-entity position="0 0.1 0.9" scale="0.9 0.9 0.9">
          <a-box color="#FFFFFF" depth="0.5" height="0.25" width="0.25" position="0 0.15 0"></a-box>
          <a-box color="#E0E0E0" depth="0.2" height="0.2" width="0.2" position="0 0.3 -0.25"></a-box>
          <a-cone color="#FFFFFF" radius-bottom="0.05" height="0.1" position="-0.07 0.4 -0.25"></a-cone>
          <a-cone color="#FFFFFF" radius-bottom="0.05" height="0.1" position="0.07 0.4 -0.25"></a-cone>
          <a-entity position="0 0.25 0.25" animation="property: rotation; to: 0 30 0; dir: alternate; loop: true; dur: 400;">
            <a-cylinder color="#E0E0E0" radius="0.03" height="0.4" rotation="40 0 0" position="0 0.1 0.1"></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // รอให้หน้าเว็บโหลดเสร็จก่อนผูก Event (แก้บั๊กเปิดไม่ติดในบางเบราว์เซอร์)
    window.onload = () => {
      const marker = document.getElementById('hiro-marker');
      const statusText = document.getElementById('status-text');
      const orbits = document.querySelectorAll('.orbit');
      const btnWalk = document.getElementById('btn-walk');
      const btnStop = document.getElementById('btn-stop');

      if (marker) {
        marker.addEventListener('markerFound', () => {
          statusText.style.display = 'block';
        });
        marker.addEventListener('markerLost', () => {
          statusText.style.display = 'none';
        });
      }

      btnWalk.addEventListener('click', () => {
        orbits.forEach(orbit => orbit.emit('resumeWalk'));
      });

      btnStop.addEventListener('click', () => {
        orbits.forEach(orbit => orbit.emit('pauseWalk'));
      });
    };
  </script>
</body>
</html>
